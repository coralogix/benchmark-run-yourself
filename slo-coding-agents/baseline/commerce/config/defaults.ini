; Larder commerce defaults (shared by every service in this repo).
;
; These are the *fallback* values. Environment wins, see
; libs/larder_common/settings.py.
; (last reviewed: DP 2019-04-02, sections per service added TH 2023-02)

[larder]
env = production
host = 127.0.0.1
; port is normally injected by the process manager (PORT)
port = 5000
data_dir = ./var
log_level = INFO
log_format = %%(asctime)s [%%(levelname)s] %%(name)s: %%(message)s
; shared secret for internal calls. nothing checks it any more.
internal_key = sf-internal-2018

[http]
; outbound client defaults (larder_common/http.py)
; timeout in seconds, empty = no timeout
timeout = 10
extra_attempts = 2
retry_wait = 0.5

[catalog]
default_per_page = 20
max_per_page = 100

[search]
; max cached queries before the cache is recycled
cache_soft_limit = 2000
results_limit = 50
personalise = true
live_prices = true
live_price_top_n = 6

[pricing]
engine = v2
free_delivery_threshold = 40.00
delivery_fee = 3.99

[coupons]
; legacy promo spreadsheet date format, kept for the 2016 import
legacy_date_format = %%d/%%b/%%Y
case_sensitive = false

[cart]
max_lines = 60
max_qty_per_line = 99

[checkout]
order_ref_prefix = LD-

[recommendations]
candidates = 12
limit = 6

[crm]
enabled = false
endpoint = https://crm.larder.internal/api/v2/events

; --- dead sections below, nothing reads these (kept for the old ansible role) ---

[storefront]
env = production
fulfilment_url = http://fulfilment.larder.internal:8081
threads = 16

[redis]
host = larder-redis-01
port = 6379
db = 3
